# Picom config — Catppuccin Mocha
backend = "glx";
vsync = true;

# Shadows
shadow = false;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Transparency
inactive-opacity = 0.93;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

# No transparency for fullscreen windows
opacity-rule = [
  "80:class_g = 'i3bar'",
  "100:class_g = 'polybar'",
  "100:class_g = 'i3-frame'",
  "100:focused = 1"
];

# Blur
blur-method = "none";

# Window type settings
wintypes:
{
  normal = { blur-background = false; };
  tooltip = { opacity = 0.85; focus = false; };
  dropdown_menu = { opacity = 0.95; };
  popup_menu = { opacity = 0.95; };
  menu = { opacity = 0.95; };
};
